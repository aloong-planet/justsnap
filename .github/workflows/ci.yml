name: CI

# A pull request that changes only documents runs the repository checks and the gate; one that changes
# anything else also runs the full test suite and the development packages. A push to main runs everything.
# Which is decided by .github/ci/routing.json (ci-scope.mjs); the github-ops skill's checks-gate.md describes it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same ref cancels the unfinished run. On main this is safe only because ci-scope.mjs
# selects every scope for a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id must stay `changes`: ci-gate.mjs reads the scopes from it.
  changes:
    name: Changed scopes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.scope.outputs.app }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: node .github/ci/ci-scope.mjs

  # Always runs, so no scope lists it and the gate always requires it.
  repo-checks:
    name: Repository checks
    runs-on: macos-latest
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: CI routing tests
        run: node --test .github/ci/*.test.mjs
      - name: Localization key gate
        run: |
          python3 -m unittest discover -s Scripts/tests -p 'test_localization_keys.py' -v
          python3 Scripts/verify-localization-keys.py
      - name: Test completion gate regression
        run: python3 -m unittest discover -s Scripts/tests -p 'test_swift_testing_log.py' -v
      - name: Accessibility report gate regression (no desktop required)
        run: python3 -m unittest discover -s Scripts/tests -p 'test_provider_accessibility.py' -v
      - name: Desktop regression scope regression
        run: python3 -m unittest discover -s Scripts/tests -p 'test_desktop_regression_needed.py' -v
      - name: Release script syntax
        run: bash -n Scripts/*.sh

  test-and-package:
    name: Application checks
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Report toolchain
        run: /usr/bin/xcrun swift --version
      - name: Strict build
        run: >-
          /usr/bin/xcrun swift build
          -Xswiftc -warnings-as-errors
          -Xcc -Wall -Xcc -Wextra -Xcc -Werror
      - name: Full test suite
        run: |
          set -euo pipefail
          /usr/bin/xcrun swift test --skip ProviderApplicationTests 2>&1 | tee "$RUNNER_TEMP/non-app-tests.log"
          python3 Scripts/verify-swift-testing-log.py "$RUNNER_TEMP/non-app-tests.log"
          /usr/bin/xcrun swift test --filter ProviderApplicationTests --skip ProviderApplicationTestsNativeMenu 2>&1 | tee "$RUNNER_TEMP/app-tests.log"
          python3 Scripts/verify-swift-testing-log.py "$RUNNER_TEMP/app-tests.log"
      - name: Native Provider main-menu Paste (isolated process)
        timeout-minutes: 2
        run: |
          set -o pipefail
          /usr/bin/xcrun swift test --filter ProviderApplicationTestsNativeMenu.testNativeMainMenuPasteValidatesThroughRealKeyWindow | tee "$RUNNER_TEMP/provider-paste.log"
          grep -F 'Executed 1 test, with 0 failures' "$RUNNER_TEMP/provider-paste.log"
      - name: Native Provider closed-window completion (isolated process)
        timeout-minutes: 2
        run: |
          set -o pipefail
          /usr/bin/xcrun swift test --filter ProviderApplicationTestsNativeMenu.testValidationCompletesWhileManagementRemainsClosed | tee "$RUNNER_TEMP/provider-closed.log"
          grep -F 'Executed 1 test, with 0 failures' "$RUNNER_TEMP/provider-closed.log"
      - name: Native Provider thrown-operation cleanup (isolated process)
        timeout-minutes: 2
        run: |
          set -o pipefail
          /usr/bin/xcrun swift test --filter ProviderApplicationTestsNativeMenu.testThrownNativeOperationReleasesViewsWithoutChangingExistingWindows | tee "$RUNNER_TEMP/provider-thrown.log"
          grep -F 'Executed 1 test, with 0 failures' "$RUNNER_TEMP/provider-thrown.log"
      - name: Development package
        env:
          VERSION: 0.0.0-ci
          BUILD_VERSION: ${{ github.run_number }}
          APPCAST_BASE_URL: https://ci.invalid/justsnap
          SPARKLE_PUBLIC_ED_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          OUTPUT_ROOT: ${{ runner.temp }}/justsnap-development-dmgs
        run: Scripts/build-development-dmgs.sh

  # The one required check. `needs` lists every other job of this workflow; `always()` makes it run after a
  # failure or a skip upstream, which the default `success()` would not.
  ci-gate:
    name: CI gate
    needs: [changes, repo-checks, test-and-package]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify the selected jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/ci/ci-gate.mjs
